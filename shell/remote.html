<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DSH-MOBILE 远程连接</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --card: #161b23;
      --line: #28303d;
      --text: #e8edf7;
      --muted: #95a1b5;
      --blue: #2f7df6;
      --green: #34c759;
      --red: #ff5f57;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 13px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
    }
    .app { padding: 22px 24px 18px; height: 100%; display: flex; flex-direction: column; }
    header { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
    .logo {
      width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
      background: linear-gradient(145deg, #2f7df6, #1b5fd6); color: #fff; font-weight: 800; font-size: 15px;
      box-shadow: 0 8px 22px rgba(47,125,246,.28);
    }
    h1 { margin: 0; font-size: 17px; letter-spacing: .02em; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .status {
      display: flex; align-items: center; gap: 8px; padding: 9px 12px; margin-bottom: 14px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #657085; box-shadow: 0 0 0 3px rgba(101,112,133,.15); }
    .status.on { color: #bfe9c9; border-color: rgba(52,199,89,.35); }
    .status.on .dot { background: var(--green); box-shadow: 0 0 0 3px rgba(52,199,89,.16); }
    .modes {
      display: flex; gap: 4px; padding: 4px; margin-bottom: 12px;
      border: 1px solid var(--line); border-radius: 11px; background: #121821;
    }
    .modes button {
      flex: 1; border: 0; border-radius: 8px; background: transparent;
      color: var(--muted); padding: 8px 6px; font-size: 12px;
    }
    .modes button.active { background: #263447; color: #fff; }
    .modes button:disabled { opacity: .7; }
    .panel {
      border: 1px solid var(--line); border-radius: 14px; background: var(--card);
      padding: 16px; margin-bottom: 16px;
    }
    .label { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 7px; }
    .codeRow { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .code {
      flex: 1; font: 700 30px/1.1 "Consolas", monospace; letter-spacing: .22em;
      color: #fff; background: #0d1219; border: 1px solid #303a49; border-radius: 10px;
      padding: 12px 14px; text-align: center;
    }
    .code.off { color: #59657a; letter-spacing: .18em; }
    .code.public { font-size: 16px; letter-spacing: .04em; line-height: 1.35; word-break: break-all; }
    button {
      border: 1px solid var(--line); background: #1d2530; color: var(--text);
      border-radius: 9px; padding: 8px 12px; font: inherit; cursor: pointer;
    }
    button:hover { border-color: #3b475a; background: #232c39; }
    button:disabled { opacity: .55; cursor: default; }
    .primary {
      width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--blue); color: #fff;
      font-size: 15px; font-weight: 650; letter-spacing: .03em; margin-top: auto;
      box-shadow: 0 10px 24px rgba(47,125,246,.24);
    }
    .primary:hover { background: #3d8bff; }
    .primary.stop { background: #2a3341; box-shadow: none; border: 1px solid var(--line); }
    .urls { display: flex; flex-direction: column; gap: 7px; min-height: 38px; }
    .urlRow { display: flex; gap: 8px; align-items: center; min-width: 0; }
    .url {
      flex: 1; min-width: 0; font: 12.5px/1.4 "Consolas", monospace; color: #cfe0ff;
      background: #0d1219; border: 1px solid #303a49; border-radius: 8px; padding: 8px 10px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text;
    }
    .empty { color: #6f7b8f; font-size: 12px; padding: 8px 0; }
    .hint { color: var(--muted); font-size: 11.5px; line-height: 1.6; margin: 12px 2px 0; }
    .hint b { color: #ffd28a; font-weight: 600; }
    .error { color: #ff9b95; font-size: 12px; min-height: 18px; margin-top: 8px; }
    .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; color: #6f7b8f; font-size: 11px; }
    .foot button { padding: 5px 9px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">DSH</div>
      <div>
        <h1>远程连接</h1>
        <p>手机通过局域网操控这台电脑上的 DSH</p>
      </div>
    </header>

    <div id="modes" class="modes">
      <button type="button" data-mode="lan" class="active">局域网</button>
      <button type="button" data-mode="public">公网（Cloudflare）</button>
    </div>

    <div id="status" class="status"><span class="dot"></span><span id="statusText">未开启</span></div>

    <div class="panel">
      <div class="label">6 位连接密码</div>
      <div class="codeRow">
        <div id="code" class="code off">------</div>
        <button id="copyCode" disabled>复制</button>
      </div>

      <div class="label">手机访问地址</div>
      <div id="urls" class="urls"><div class="empty">开启后自动生成</div></div>
    </div>

    <button id="toggle" class="primary">开启连接</button>
    <div id="error" class="error"></div>
    <p id="hint" class="hint">
      手机和电脑需要连同一个 Wi-Fi。密码等同于这台电脑 DSH 的<b>完整操作权限</b>，
      请只给自己信任的设备使用，不要截图外传。
    </p>

    <div class="foot">
      <button id="close">关闭窗口</button>
      <span id="engine"></span>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)
    let running = false
    let busy = false
    let selectedMode = 'lan'

    const modeButtons = [...document.querySelectorAll('#modes button')]
    function selectMode(mode) {
      if (running || busy) return
      selectedMode = mode
      for (const button of modeButtons) button.classList.toggle('active', button.dataset.mode === mode)
      $('hint').innerHTML = mode === 'public'
        ? '公网模式会把 DSH 暴露到 Cloudflare 的临时 HTTPS 地址。密码是<b>唯一门槛</b>，只临时开启，用完立刻关闭；不要用于长期无人值守。'
        : '手机和电脑需要连同一个 Wi-Fi。密码等同于这台电脑 DSH 的<b>完整操作权限</b>，请只给自己信任的设备使用，不要截图外传。'
      $('toggle').textContent = mode === 'public' ? '开启公网访问' : '开启连接'
    }
    for (const button of modeButtons) {
      button.addEventListener('click', () => selectMode(button.dataset.mode))
    }

    function setBusy(value, label) {
      busy = value
      $('toggle').disabled = value
      if (value) $('toggle').textContent = label
    }

    function render(state) {
      running = Boolean(state && state.running)
      if (running && state.mode) selectedMode = state.mode
      for (const button of modeButtons) {
        button.classList.toggle('active', button.dataset.mode === selectedMode)
        button.disabled = running || busy
      }
      $('status').classList.toggle('on', running)
      $('statusText').textContent = running
        ? (state.mode === 'public' ? '已开启 · 公网访问' : '已开启 · 等待手机连接')
        : '未开启'
      $('code').textContent = running && state.code ? state.code : '------'
      $('code').classList.toggle('off', !running)
      $('code').classList.toggle('public', running && state.mode === 'public')
      $('copyCode').disabled = !running
      $('engine').textContent = state && state.enginePort ? `engine 127.0.0.1:${state.enginePort}` : ''
      $('hint').innerHTML = selectedMode === 'public'
        ? '公网模式会把 DSH 暴露到 Cloudflare 的临时 HTTPS 地址。密码是<b>唯一门槛</b>，只临时开启，用完立刻关闭；不要用于长期无人值守。'
        : '手机和电脑需要连同一个 Wi-Fi。密码等同于这台电脑 DSH 的<b>完整操作权限</b>，请只给自己信任的设备使用，不要截图外传。'

      const urls = $('urls')
      urls.textContent = ''
      if (running && state.urls && state.urls.length) {
        for (const url of state.urls) {
          const row = document.createElement('div')
          row.className = 'urlRow'
          const value = document.createElement('div')
          value.className = 'url'
          value.textContent = url
          const copy = document.createElement('button')
          copy.textContent = '复制'
          copy.addEventListener('click', async () => {
            await window.dshRemote.copy(url)
            copy.textContent = '已复制'
            setTimeout(() => { copy.textContent = '复制' }, 1200)
          })
          row.append(value, copy)
          urls.append(row)
        }
      } else {
        const empty = document.createElement('div')
        empty.className = 'empty'
        empty.textContent = running
          ? (state.mode === 'public' ? '正在分配公网地址…' : '没有检测到局域网 IPv4 地址')
          : '开启后自动生成'
        urls.append(empty)
      }

      $('toggle').textContent = running ? '关闭连接' : (selectedMode === 'public' ? '开启公网访问' : '开启连接')
      $('toggle').classList.toggle('stop', running)
      $('error').textContent = ''
      busy = false
      $('toggle').disabled = false
      for (const button of modeButtons) button.disabled = running
    }

    $('toggle').addEventListener('click', async () => {
      if (busy) return
      $('error').textContent = ''
      if (running) {
        setBusy(true, '正在关闭…')
        const result = await window.dshRemote.stop()
        render(result.state)
      } else {
        if (selectedMode === 'public' && !confirm('公网模式会生成一个任何人都能访问的 Cloudflare 临时地址。\n\n确认只临时开启，并在用完后立即关闭？')) return
        setBusy(true, selectedMode === 'public' ? '正在建立公网隧道…' : '正在开启…')
        const result = await window.dshRemote.start(selectedMode)
        if (!result.ok) {
          render(result.state)
          $('error').textContent = result.error || '开启失败'
          $('toggle').disabled = false
          $('toggle').textContent = selectedMode === 'public' ? '开启公网访问' : '开启连接'
          busy = false
        } else {
          render(result.state)
        }
      }
    })

    $('copyCode').addEventListener('click', async () => {
      const code = $('code').textContent
      if (!code || code === '------') return
      await window.dshRemote.copy(code)
      $('copyCode').textContent = '已复制'
      setTimeout(() => { $('copyCode').textContent = '复制' }, 1200)
    })

    $('close').addEventListener('click', () => window.dshRemote.close())

    window.dshRemote.state().then(render).catch(() => render(null))
  </script>
</body>
</html>
